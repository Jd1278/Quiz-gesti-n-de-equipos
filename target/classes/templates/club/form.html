<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Formulario Club - JPA Relations</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 p-8">
    
    <!-- Título Dinámico -->
    <h2 class="text-2xl font-bold text-slate-900 mb-6 flex items-center gap-2">
      <span>🏟️</span> 
      <span th:text="${club.id == null ? 'Nuevo Club' : 'Editar Club'}">Nuevo Club</span>
    </h2>

    <!-- Formulario -->
    <form th:action="@{/clubes/guardar}" th:object="${club}" method="post" class="space-y-5">
      
      <!-- ID Oculto -->
      <input type="hidden" th:field="*{id}"/>

      <!-- Campo: Nombre -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Nombre del Club</label>
        <input type="text" th:field="*{nombre}" required
               placeholder="Ej. Real Madrid, Manchester City..."
               class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 transition-all focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50"/>
      </div>

      <!-- Campo: Entrenador (Relación 1:1 / N:1) -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Entrenador asignado</label>
        <div class="relative">
          <select th:field="*{entrenador}" 
                  class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-700 transition-all focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 appearance-none cursor-pointer">
            <option value="">-- Sin entrenador --</option>
            <option th:each="e : ${entrenadores}"
                    th:value="${e.id}"
                    th:text="${e.nombre + ' ' + e.apellido}"
                    th:selected="${club.entrenador != null && club.entrenador.id == e.id}"/>
          </select>
          <!-- Flecha personalizada para el Select -->
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </div>
      </div>

      <!-- Campo: Asociación (Relación N:1) -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Asociación</label>
        <div class="relative">
          <select th:field="*{asociacion}" 
                  class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-700 transition-all focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 appearance-none cursor-pointer">
            <option value="">-- Sin asociación --</option>
            <option th:each="a : ${asociaciones}"
                    th:value="${a.id}"
                    th:text="${a.nombre}"
                    th:selected="${club.asociacion != null && club.asociacion.id == a.id}"/>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </div>
      </div>

      <!-- Campo: Competiciones (Relación N:M - Selección Múltiple) -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Competiciones inscritas</label>
        <p class="text-xs text-slate-400 mb-2.5">Mantén presionado <kbd class="bg-slate-100 px-1 py-0.5 rounded border border-slate-200 font-mono text-[10px]">Ctrl</kbd> (o <kbd class="bg-slate-100 px-1 py-0.5 rounded border border-slate-200 font-mono text-[10px]">Cmd</kbd> en Mac) para elegir más de una opción.</p>
        <select th:field="*{competiciones}" multiple size="4"
                class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-slate-700 transition-all focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 overflow-y-auto">
          <option th:each="comp : ${competiciones}"
                  th:value="${comp.id}"
                  th:text="${comp.nombre}"
                  class="rounded-lg py-1.5 px-2 my-0.5 checked:bg-indigo-600 checked:text-white cursor-pointer"/>
        </select>
      </div>

      <!-- Barra de Acciones del Formulario -->
      <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100 mt-6">
        <a href="/clubes" 
           class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors">
          Cancelar
        </a>
        <button type="submit" 
                class="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-emerald-600 rounded-xl text-sm font-semibold text-white shadow-md shadow-emerald-600/10 hover:bg-emerald-700 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
          </svg>
          Guardar Club
        </button>
      </div>

    </form>
  </div>

</body>
</html>
