<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
   <meta charset="UTF-8"/>
   <title>Jugadores - JPA Relations</title>
   <!-- Tailwind CSS CDN -->
   <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen antialiased text-slate-800">

    <div class="max-w-6xl mx-auto px-4 py-8">
         
     <!-- Cabecera del Dashboard -->
     <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
       <div>
         <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
           <span class="text-3xl">🏃</span> Jugadores
         </h1>
         <p class="text-sm text-slate-500 mt-1">Listado de la plantilla, posiciones y dorsales de los deportistas.</p>
       </div>
       
       <!-- Botones de Acción -->
       <div class="flex items-center gap-3">
         <a href="/" class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-600 shadow-sm hover:bg-slate-100 hover:text-slate-900 transition-colors">
           <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
             <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
           </svg>
           Inicio
         </a>
         <a href="/jugadores/nuevo" class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-indigo-600 rounded-xl text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 transition-colors">
           <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
             <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
           </svg>
           Nuevo Jugador
         </a>
       </div>
     </div>

     <!-- Contenedor Controlado de la Tabla -->
     <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
       <div class="overflow-x-auto">
         <table class="w-full text-left border-collapse">
           <thead>
             <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600 uppercase tracking-wider">
               <th class="px-6 py-4">ID</th>
               <th class="px-6 py-4">Nombre</th>
               <th class="px-6 py-4">Apellido</th>
               <th class="px-6 py-4 text-center">Número</th>
               <th class="px-6 py-4">Posición</th>
               <!-- NUEVA COLUMNA -->
               <th class="px-6 py-4">Club</th>
               <th class="px-6 py-4 text-right">Acciones</th>
             </tr>
           </thead>
           <tbody class="divide-y divide-slate-100 text-sm text-slate-600">
             <!-- Fila Dinámica de Thymeleaf -->
             <tr th:each="j : ${jugadores}" class="hover:bg-slate-50/70 transition-colors">
               <!-- ID -->
               <td class="px-6 py-4 font-mono text-xs text-slate-400" th:text="${j.id}">1</td>
               
               <!-- Datos Personales -->
               <td class="px-6 py-4 font-semibold text-slate-900" th:text="${j.nombre}">Erling</td>
               <td class="px-6 py-4 text-slate-700" th:text="${j.apellido}">Haaland</td>
               
               <!-- Dorsal / Número Estilizado -->
               <td class="px-6 py-4 text-center">
                 <span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-slate-100 border border-slate-200 text-xs font-bold text-slate-700 font-mono"
                        th:text="${j.numero}">9</span>
               </td>
               
               <!-- Posición mapeada con Badges de colores según el rol -->
               <td class="px-6 py-4">
                 <span th:text="${j.posicion}"
                       th:class="${j.posicion == 'Portero' ? 'inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-100' :
                                 j.posicion == 'Defensa' ? 'inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-blue-50 text-blue-700 border border-blue-100' :
                                 j.posicion == 'Mediocampista' ? 'inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-100' :
                                 j.posicion == 'Delantero' ? 'inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-rose-50 text-rose-700 border border-rose-100' :
                                 'inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-50 text-slate-700 border border-slate-100'}">
                    Delantero
                 </span>
               </td>

               <!-- NUEVA CELDA: Club Mapeado Dinámicamente -->
               <td class="px-6 py-4">
                 <div class="flex items-center gap-2">
                   <span class="text-base">🛡️</span>
                   <span class="font-medium text-slate-700" 
                         th:text="${j.club != null ? j.club.nombre : 'Sin Equipo Assigned'}">
                     Real Madrid
                   </span>
                 </div>
               </td>

               <!-- Botones de Acción -->
               <td class="px-6 py-4 text-right whitespace-nowrap space-x-1">
                 <a th:href="@{/jugadores/editar/{id}(id=${j.id})}"
                    class="inline-flex items-center px-3 py-1.5 bg-amber-50 border border-amber-200 rounded-lg text-xs font-semibold text-amber-700 hover:bg-amber-100 transition-colors">
                   Editar
                 </a>
                 <a th:href="@{/jugadores/eliminar/{id}(id=${j.id})}"
                    class="inline-flex items-center px-3 py-1.5 bg-red-50 border border-red-200 rounded-lg text-xs font-semibold text-red-700 hover:bg-red-100 transition-colors"
                    onclick="return confirm('¿Seguro que deseas eliminar este jugador?')">
                   Eliminar
                 </a>
               </td>
             </tr>
           </tbody>
         </table>
       </div>
     </div>
    </div>
 </body>
 </html>
