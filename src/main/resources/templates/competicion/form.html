<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Formulario Competición - JPA Relations</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 p-8">
    
    <!-- Título Dinámico -->
    <h2 class="text-2xl font-bold text-slate-900 mb-6 flex items-center gap-2">
      <span>🏆</span> 
      <span th:text="${competicion.id == null ? 'Nueva Competición' : 'Editar Competición'}">Nueva Competición</span>
    </h2>

    <!-- Formulario -->
    <form th:action="@{/competiciones/guardar}" th:object="${competicion}" method="post" class="space-y-5">
      
      <!-- ID Oculto -->
      <input type="hidden" th:field="*{id}"/>

      <!-- Campo: Nombre -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Nombre de la Competición</label>
        <input type="text" th:field="*{nombre}" required
               placeholder="Ej. UEFA Champions League, LaLiga..."
               class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 transition-all focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50"/>
      </div>

      <!-- Campo: Monto Premio (Con indicador visual) -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Monto del Premio</label>
        <div class="relative rounded-xl shadow-sm">
          <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 font-medium">
            <span>$</span>
          </div>
          <input type="number" th:field="*{montoPremio}" min="0" step="0.01"
                 placeholder="0.00"
                 class="w-full pl-8 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 transition-all focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50"/>
        </div>
      </div>

      <!-- Bloque de Fechas (Distribución en Grid Responsivo) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Fecha Inicio -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Fecha de Inicio</label>
          <input type="date" th:field="*{fechaInicio}"
                 class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-800 transition-all focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 cursor-pointer text-sm"/>
        </div>
        
        <!-- Fecha Fin -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Fecha de Finalización</label>
          <input type="date" th:field="*{fechaFin}"
                 class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-800 transition-all focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 cursor-pointer text-sm"/>
        </div>
      </div>

      <!-- Barra de Acciones -->
      <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100 mt-6">
        <a href="/competiciones" 
           class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors">
          Cancelar
        </a>
        <button type="submit" 
                class="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-emerald-600 rounded-xl text-sm font-semibold text-white shadow-md shadow-emerald-600/10 hover:bg-emerald-700 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
          </svg>
          Guardar Competición
        </button>
      </div>

    </form>
  </div>

</body>
</html>
