<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Quiz - JPA Relations</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen flex items-center justify-center antialiased p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100 p-8">
    
    <!-- Encabezado -->
    <h1 class="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-3">
      <span class="text-3xl">⚽</span> 
      <div>
        <p class="text-sm font-semibold text-indigo-600 uppercase tracking-wider">JPA Relations</p>
        <p>Gestión de Clubes</p>
      </div>
    </h1>

    <!-- Menú de Navegación -->
    <nav class="space-y-3">
      
      <a href="/clubes" class="flex items-center gap-3 px-4 py-3.5 bg-white border border-slate-200 rounded-xl text-slate-700 font-medium transition-all duration-200 hover:bg-indigo-50 hover:border-indigo-200 hover:text-indigo-700 shadow-sm hover:translate-x-1">
        <span class="text-xl">🏟️</span> Clubes
      </a>
      
      <a href="/entrenadores" class="flex items-center gap-3 px-4 py-3.5 bg-white border border-slate-200 rounded-xl text-slate-700 font-medium transition-all duration-200 hover:bg-indigo-50 hover:border-indigo-200 hover:text-indigo-700 shadow-sm hover:translate-x-1">
        <span class="text-xl">🧑‍💼</span> Entrenadores
      </a>
      
      <a href="/jugadores" class="flex items-center gap-3 px-4 py-3.5 bg-white border border-slate-200 rounded-xl text-slate-700 font-medium transition-all duration-200 hover:bg-indigo-50 hover:border-indigo-200 hover:text-indigo-700 shadow-sm hover:translate-x-1">
        <span class="text-xl">🏃</span> Jugadores
      </a>
      
      <a href="/asociaciones" class="flex items-center gap-3 px-4 py-3.5 bg-white border border-slate-200 rounded-xl text-slate-700 font-medium transition-all duration-200 hover:bg-indigo-50 hover:border-indigo-200 hover:text-indigo-700 shadow-sm hover:translate-x-1">
        <span class="text-xl">🏢</span> Asociaciones
      </a>
      
      <a href="/competiciones" class="flex items-center gap-3 px-4 py-3.5 bg-white border border-slate-200 rounded-xl text-slate-700 font-medium transition-all duration-200 hover:bg-indigo-50 hover:border-indigo-200 hover:text-indigo-700 shadow-sm hover:translate-x-1">
        <span class="text-xl">🏆</span> Competiciones
      </a>

      <!-- Separador para Herramientas de Desarrollo -->
      <div class="pt-4 border-t border-slate-100 mt-5">
        <a href="/h2-console" target="_blank" class="flex items-center justify-between px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-600 text-sm font-semibold transition-all duration-200 hover:bg-slate-100 hover:text-slate-800 hover:border-slate-300">
          <span class="flex items-center gap-3">
            <span class="text-lg">🗄️</span> H2 Console
          </span>
          <!-- Icono de enlace externo -->
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
          </svg>
        </a>
      </div>

    </nav>
  </div>

</body>
</html>
